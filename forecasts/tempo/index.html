


<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">
<title>Previsão ETA - Moçambique</title>

<link rel="stylesheet" href="assets/css/tempo.css">

</head>

<body>

<h1>Previsão Numérica ETA</h1>

<p>
Modelo ETA - previsão para Moçambique
</p>


<div class="controls">

<label>
Variável:
</label>

<select id="variable">

<option value="rain">
Precipitação
</option>

<option value="tmax">
Temperatura Máxima
</option>

<option value="tmean">
Temperatura Média
</option>

<option value="tmin">
Temperatura Mínima
</option>

<option value="wind">
Vento
</option>

</select>



<label>
Horizonte:
</label>

<select id="hour">

<option value="24">
24 horas
</option>

<option value="48">
48 horas
</option>

<option value="72">
72 horas
</option>

</select>


</div>


<div class="image-container">

<img id="forecast-image"
src=""
alt="Previsão ETA">

</div>


<div class="downloads">

<a id="png-link" target="_blank">
PNG
</a>

<a id="txt-link" target="_blank">
TXT
</a>

<a id="csv-link" target="_blank">
CSV
</a>


</div>



<script src="assets/js/tempo.js"></script>

</body>

</html>
