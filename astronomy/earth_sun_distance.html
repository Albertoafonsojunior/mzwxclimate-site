


<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<title>MZ WX & Climate - Distância Terra-Sol</title>

<style>

body{

    font-family:Arial,sans-serif;

    background:#eef3f8;

    margin:0;

    padding:30px;

}

.container{

    max-width:1000px;

    margin:auto;

    display:flex;

    gap:25px;

}

.left{

    width:320px;

    background:white;

    padding:20px;

    border-radius:12px;

    box-shadow:0 0 12px rgba(0,0,0,.12);

}

.right{

    flex:1;

    background:white;

    padding:25px;

    border-radius:12px;

    box-shadow:0 0 12px rgba(0,0,0,.12);

}

input{

    width:100%;

    padding:10px;

    font-size:16px;

    margin-top:10px;

    margin-bottom:20px;

}

.value{

    font-size:34px;

    font-weight:bold;

    color:#d35400;

}

.small{

    color:#666;

}

</style>

</head>

<body>

<div class="container">

<div class="left">

<h2>☀️ Distância Terra–Sol</h2>

<label>Data</label>

<input
type="date"
id="date">

</div>

<div class="right">

<div id="result">

Escolha uma data.

</div>

</div>

</div>

<script src="../assets/js/astronomy.js"></script>

<script>

function updateDistance(){

    if(date.value=="") return;

    const p=date.value.split("-");

    const year=parseInt(p[0]);

    const month=parseInt(p[1]);

    const day=parseInt(p[2]);

    const d=earthSunDistance(

        year,

        month,

        day

    );

    result.innerHTML=`

<h2>📅 ${date.value}</h2>

<hr>

<p>

☀️ Distância Terra–Sol

</p>

<p class="value">

${d.distance_km.toLocaleString(
"pt-BR",
{
maximumFractionDigits:0
}
)} km

</p>

<p>

🌍

${d.distance_au.toFixed(6)} UA

</p>

<p>

📅 Dia do ano:

${d.day_of_year}

</p>

`;

}

date.valueAsDate=new Date();

updateDistance();

date.onchange=updateDistance;

</script>

</body>

</html>
