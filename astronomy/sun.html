


<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<title>MZ WX & Climate - Astronomia</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#eef3f8;
    margin:0;
    padding:40px;
}

.container{

    max-width:900px;

    margin:auto;

    background:white;

    padding:30px;

    border-radius:12px;

    box-shadow:0 0 15px rgba(0,0,0,.15);

}

h1{

    color:#0b4f9c;

}

select,
input{

    width:100%;

    padding:12px;

    margin-top:8px;

    margin-bottom:20px;

    font-size:16px;

}

.result{

    margin-top:25px;

    padding:20px;

    background:#f7fbff;

    border-left:6px solid #1565c0;

    border-radius:8px;

}

.value{

    font-size:28px;

    font-weight:bold;

    color:#e67e22;

}

.small{

    color:#666;

}

</style>

</head>

<body>

<div class="container">

<h1>☀️ Nascer e Pôr do Sol</h1>

<p>

Seleccione uma província,
um distrito e uma data.

</p>

<label>

Província

</label>

<select id="province"></select>

<label>

Distrito

</label>

<select id="district"></select>

<label>

Data

</label>

<input
type="date"
id="date">

<div
id="result"
class="result">

Escolha uma localidade.

</div>

</div>

<script src="../assets/js/astronomy.js"></script>

<script>

let locations=[];

fetch("../data/locations.json")

.then(r=>r.json())

.then(json=>{

    locations=json;

    loadProvinces();

});



function loadProvinces(){

    let provinces=[
        ...new Set(
            locations.map(
                x=>x.province
            )
        )
    ];

    provinces.sort();

    let html="";

    provinces.forEach(p=>{

        html+=`<option>${p}</option>`;

    });

    province.innerHTML=html;

    loadDistricts();

}



function loadDistricts(){

    let prov=
        province.value;

    let districts=

        locations

        .filter(

            x=>x.province==prov

        )

        .sort(

            (a,b)=>

            a.district.localeCompare(
                b.district
            )

        );

    let html="";

    districts.forEach(d=>{

        html+=`

<option value="${d.district}">
${d.district}
</option>

`;

    });

    district.innerHTML=html;

    calculate();

}



function calculate(){

    let prov=
        province.value;

    let dist=
        district.value;

    let dt=
        date.value;

    if(dt==""){

        return;

    }

    let loc=

        locations.find(

            x=>

            x.province==prov &&

            x.district==dist

        );

    if(!loc){

        return;

    }

    let parts=
        dt.split("-");

    let year=
        parseInt(parts[0]);

    let month=
        parseInt(parts[1]);

    let day=
        parseInt(parts[2]);

    let sun=

        calculateSunTimes(

            loc.lat,

            loc.lon,

            year,

            month,

            day

        );

    result.innerHTML=

`

<h2>

${dist}

</h2>

<p>

${prov}

</p>

<hr>

<p>

📅 ${dt}

</p>

<p>

🌅

<span class="value">

${sun.sunrise}

</span>

</p>

<p>

🌇

<span class="value">

${sun.sunset}

</span>

</p>

<p>

☀️

${sun.day_length}

</p>

<p class="small">

Latitude:
${loc.lat.toFixed(4)}

<br>

Longitude:
${loc.lon.toFixed(4)}

</p>

`;

}



province.onchange=loadDistricts;

district.onchange=calculate;

date.onchange=calculate;

date.valueAsDate=new Date();

</script>

</body>

</html>
